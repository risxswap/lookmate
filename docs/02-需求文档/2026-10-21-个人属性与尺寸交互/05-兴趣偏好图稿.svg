<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1440" viewBox="0 0 1440 1440"><style>text{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif;fill:#203d32}.muted{fill:#6d7e75}</style><rect width="1440" height="1440" fill="#f6f8f6"/><text x="64" y="55" font-size="17" class="">LOOKMATE  /  个人资料</text><text x="64" y="101" font-size="30" class="">记录兴趣，让建议更贴近你</text><text x="64" y="134" font-size="14" class="muted">设计图稿 · 示例内容，不是实际用户资料或已实现页面</text><rect x="64" y="162" width="150" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="80" y="186" font-size="14" class="">基础资料</text><rect x="234" y="162" width="150" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="250" y="186" font-size="14" class="">我的照片</text><rect x="404" y="162" width="150" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="420" y="186" font-size="14" class="">身体尺寸</text><rect x="574" y="162" width="150" height="36" rx="18" fill="#e1eee6" stroke="#7d9e87"/><text x="590" y="186" font-size="14" class="">兴趣与偏好</text><rect x="64" y="218" width="1312" height="706" rx="12" fill="#fff" stroke="#dce5df"/><text x="88" y="257" font-size="21" class="">兴趣与活动</text><text x="88" y="286" font-size="14" class="muted">可多选，也可以添加自己的兴趣。以下选择均为示例。</text><rect x="88" y="305" width="132" height="36" rx="18" fill="#e1eee6" stroke="#7d9e87"/><text x="104" y="329" font-size="14" class="">徒步</text><rect x="238" y="305" width="132" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="254" y="329" font-size="14" class="">露营</text><rect x="388" y="305" width="132" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="404" y="329" font-size="14" class="">骑行</text><rect x="538" y="305" width="132" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="554" y="329" font-size="14" class="">健身</text><rect x="688" y="305" width="132" height="36" rx="18" fill="#e1eee6" stroke="#7d9e87"/><text x="704" y="329" font-size="14" class="">旅行</text><rect x="838" y="305" width="132" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="854" y="329" font-size="14" class="">摄影</text><rect x="988" y="305" width="132" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="1004" y="329" font-size="14" class="">音乐</text><rect x="1138" y="305" width="132" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="1154" y="329" font-size="14" class="">＋ 自定义</text><text x="88" y="392" font-size="21" class="">穿搭偏好</text><text x="88" y="425" font-size="14" class="muted">风格</text><rect x="160" y="402" width="132" height="36" rx="18" fill="#e1eee6" stroke="#7d9e87"/><text x="176" y="426" font-size="14" class="">简约</text><rect x="311" y="402" width="132" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="327" y="426" font-size="14" class="">休闲</text><rect x="462" y="402" width="132" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="478" y="426" font-size="14" class="">通勤</text><rect x="613" y="402" width="132" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="629" y="426" font-size="14" class="">运动</text><rect x="764" y="402" width="132" height="36" rx="18" fill="#e1eee6" stroke="#7d9e87"/><text x="780" y="426" font-size="14" class="">户外</text><rect x="915" y="402" width="132" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="931" y="426" font-size="14" class="">复古</text><rect x="1066" y="402" width="132" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="1082" y="426" font-size="14" class="">＋ 自定义</text><text x="88" y="477" font-size="14" class="">喜欢的颜色</text><rect x="230" y="453" width="100" height="36" rx="18" fill="#e1eee6" stroke="#7d9e87"/><circle cx="246" cy="471" r="6" fill="#d7c7a4"/><text x="260" y="477" font-size="14" class="">米色</text><rect x="342" y="453" width="100" height="36" rx="18" fill="#e1eee6" stroke="#7d9e87"/><circle cx="358" cy="471" r="6" fill="#69866a"/><text x="372" y="477" font-size="14" class="">绿</text><rect x="454" y="453" width="110" height="36" rx="18" fill="#