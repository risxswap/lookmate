685" font-size="14" class="">不接受</text><text x="740" y="686" font-size="14" class="">烫发</text><rect x="810" y="661" width="110" height="36" rx="18" fill="#e1eee6" stroke="#7d9e87"/><text x="826" y="685" font-size="14" class="">未设置</text><rect x="932" y="661" width="110" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="948" y="685" font-size="14" class="">可接受</text><rect x="1054" y="661" width="110" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="1070" y="685" font-size="14" class="">不接受</text><text x="88" y="755" font-size="21" class="">明确限制</text><text x="88" y="783" font-size="14" class="muted">这些要求会作为限制使用，与一般不喜欢区分。</text><rect x="88" y="800" width="150" height="36" rx="18" fill="#e1eee6" stroke="#7d9e87"/><text x="104" y="824" font-size="14" class="">不穿高跟鞋</text><rect x="254" y="800" width="150" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="270" y="824" font-size="14" class="">不穿露腰款</text><rect x="420" y="800" width="150" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="436" y="824" font-size="14" class="">不穿紧身款</text><rect x="586" y="800" width="150" height="36" rx="18" fill="#fff" stroke="#dce5df"/><text x="602" y="824" font-size="14" class="">不接受剪短</text><rect x="88" y="851" width="1264" height="48" rx="12" fill="#fff" stroke="#dce5df"/><text x="104" y="882" font-size="14" class="muted">补充说明（最多 500 字符）……</text><rect x="64" y="940" width="1312" height="64" rx="12" fill="#fff" stroke="#dce5df"/><text x="88" y="979" font-size="14" class="muted">示例仅展示主要控件；各组另设补充文字，完整字段见设计文档。</text><rect x="1160" y="954" width="184" height="36" rx="18" fill="#e1eee6" stroke="#7d9e87"/><text x="1176" y="978" font-size="14" class="">保存偏好</text></svg>