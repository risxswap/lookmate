serverAddr = {{ printf "%q" .Envs.FRP_SERVER_ADDR }}
serverPort = {{ .Envs.FRP_SERVER_PORT }}
loginFailExit = true
auth.method = "token"
auth.token = {{ printf "%q" .Envs.FRP_TOKEN }}
transport.tls.enable = true
{{ if .Envs.FRP_TLS_CA_FILE }}
transport.tls.trustedCaFile = {{ printf "%q" .Envs.FRP_TLS_CA_FILE }}
{{ end }}
{{ if .Envs.FRP_TLS_SERVER_NAME }}
transport.tls.serverName = {{ printf "%q" .Envs.FRP_TLS_SERVER_NAME }}
{{ end }}

[[proxies]]
name = {{ printf "%q" .Envs.FRP_PROXY_NAME }}
type = "tcp"
localIP = {{ printf "%q" .Envs.FRP_LOCAL_IP }}
localPort = {{ .Envs.FRP_LOCAL_PORT }}
remotePort = {{ .Envs.FRP_REMOTE_PORT }}
