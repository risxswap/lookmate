spring:
  application:
    name: lookmate-server
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      fail-on-unknown-properties: true
  session:
    timeout: 2h
    data:
      redis:
        namespace: lookmate:server:sessions
  data:
    redis:
      connect-timeout: 3s
      timeout: 3s
  datasource:
    hikari:
      connection-timeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        name: LOOKMATE_SESSION
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
lookmate:
  auth:
    registration-enabled: false
